defaults:
  - _self_

hydra:
  run:
    dir: "results/outputs/" 

model:
  name: "timesformer-k400"
  pretrained: False

seed: 42
trainer:
  max_epochs: 30
  optimizer:
    name: "adamW"
    lr: 1e-5
    betas: [0.9,0.999]
    weight_decay: 0.1
  loss_fn:
    name: "binary_cross_entropy"
  val_check_interval: 2
  num_gpus: 1
  device_ids: [0,1,2,3]

data:
  feature_type: video
  dataset_name: "GenVideo"
  num_workers: 16
  data_path: "../Data/${data.dataset_name}"
  num_frames: 8
  generation_model: "Pika" 
  input_shape: [256,256]
  train_real_model: "Kinetics-400"
  val_real_model: "Kinetics-400"
  test_real_model: "MSR-VTT"
  train_load_len: 10000
  test_load_len: 500
  batch_size: 16
  val_batch_size: 32

ckpt_path: results/ckpts/baselines/standard-Pika-npr/best_auroc_ckpt.pth
experiment_name: "standard-Pika-npr"
log_path: "./results/test/baselines"
save_csv_file: standard-Pika-npr.csv

revise: True
inference:
  demo_path: "../Data/demo/sora2_frames"
  label: "fake"